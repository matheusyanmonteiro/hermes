name: hermes

x-source-volumes: &source-volumes
  - .:/app
  - root_node_modules:/app/node_modules
  - web_node_modules:/app/apps/web/node_modules
  - api_node_modules:/app/apps/api/node_modules
  - database_node_modules:/app/packages/database/node_modules
  - contracts_node_modules:/app/packages/contracts/node_modules
  - permissions_node_modules:/app/packages/permissions/node_modules
  - api_next:/app/apps/api/.next
  - web_next:/app/apps/web/.next
  - turbo_cache:/app/.turbo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes_local_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes_local_change_me}@db:5432/${POSTGRES_DB:-hermes}?schema=public
    command: ["pnpm", "db:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment:
      <<: *app-environment
    command: ["pnpm", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  dependencies:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["pnpm", "install", "--frozen-lockfile", "--store-dir", "/pnpm/store"]
    environment:
      CI: "true"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - database_node_modules:/app/packages/database/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - permissions_node_modules:/app/packages/permissions/node_modules
      - pnpm_store:/pnpm/store
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["pnpm", "--filter", "@hermes/api", "dev"]
    environment:
      <<: *app-environment
      PORT: 3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      AUTH_MODE: ${AUTH_MODE:-development}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-troque-esta-chave-local-por-uma-frase-com-32-caracteres}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-hermes-dev}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/v1/drive/oauth/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      PORTAL_TIMEZONE: ${PORTAL_TIMEZONE:-America/Sao_Paulo}
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes: *source-volumes
    depends_on:
      seed:
        condition: service_completed_successfully
      dependencies:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["pnpm", "--filter", "@hermes/web", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-development}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes: *source-volumes
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/login >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  root_node_modules:
  web_node_modules:
  api_node_modules:
  database_node_modules:
  contracts_node_modules:
  permissions_node_modules:
  api_next:
  web_next:
  turbo_cache:
  pnpm_store:

